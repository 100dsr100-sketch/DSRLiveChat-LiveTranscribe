<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#222222">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiveChat">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>DSR Live Chat Translator</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #111;
    touch-action: manipulation;
  }
  #lockScreen {
    position: fixed; inset: 0;
    background: #111;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  #lockScreen.hidden { display: none; }
  #lockBox {
    background: #222;
    border: 1px solid #444;
    border-radius: 18px;
    padding: 36px;
    width: 390px;
    text-align: center;
  }
  #lockBox input {
    width: 100%;
    padding: 15px;
    font-size: 24px;
    border-radius: 12px;
    border: 1px solid #555;
    background: #333;
    color: #fff;
    margin: 18px 0;
  }
  #lockBox button {
    width: 100%;
    padding: 15px;
    font-size: 23px;
    border-radius: 12px;
    border: none;
    background: #2f7dd6;
    color: #fff;
    cursor: pointer;
  }
  #lockError {
    color: #e0433b;
    font-size: 18px;
    min-height: 24px;
  }
  #roleScreen {
    position: fixed; inset: 0;
    background: #111;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 900;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  #roleScreen.hidden { display: none; }
  #roleBox {
    background: #222;
    border: 1px solid #444;
    border-radius: 18px;
    padding: 36px;
    width: 420px;
    text-align: center;
  }
  .role-title {
    font-size: 21px;
    color: #ccc;
    margin-bottom: 24px;
  }
  .role-btn {
    display: block;
    width: 100%;
    padding: 21px;
    font-size: 23px;
    border-radius: 12px;
    border: 1px solid #555;
    background: #333;
    color: #fff;
    cursor: pointer;
    margin-bottom: 15px;
  }
  .role-btn:active { background: #2f7dd6; }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  #app.hidden { display: none; }
  .conn-status {
    flex: 0 0 100%;
    text-align: center;
    font-size: 17px;
    color: #999;
    min-height: 21px;
  }
  .change-role-link {
    font-size: 15px;
    color: #d4af37;
    text-decoration: underline;
    cursor: pointer;
    margin-top: 3px;
  }
  .top-bar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    padding: 6px;
    background: #222;
    row-gap: 3px;
  }
  .speak-status {
    flex: 0 0 100%;
    text-align: center;
    font-size: 17px;
    color: #e0433b;
    min-height: 21px;
  }
  .speak-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 20px;
    color: #ccc;
    background: #333;
    border: 1px solid #555;
    border-radius: 21px;
    padding: 6px 18px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .speak-toggle.on { background: #2f7dd6; border-color: #2f7dd6; color: #fff; }
  .lang-select {
    font-size: 20px;
    color: #eee;
    background: #333;
    border: 1px solid #555;
    border-radius: 21px;
    padding: 6px 15px;
    margin-left: 12px;
  }
  .panel {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    position: relative;
  }
  .panel-en { background: #eef3f8; }
  .panel-hi { background: #fdf0ee; }

  .panel-header {
    padding: 9px 15px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: .03em;
    color: #666;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex: 0 0 auto;
  }
  .panel-header .clear-btn {
    font-size: 17px;
    font-weight: 400;
    text-transform: none;
    color: #999;
    background: none;
    border: 1px solid #ccc;
    border-radius: 15px;
    padding: 3px 12px;
    cursor: pointer;
  }

  .messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 9px 15px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    min-height: 0;
  }
  .bubble {
    max-width: 78%;
    padding: 12px 18px;
    border-radius: 24px;
    font-size: 24px;
    line-height: 1.35;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .bubble.own {
    align-self: flex-end;
    background: #2f7dd6;
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .bubble.other {
    align-self: flex-start;
    background: #e2e5ea;
    color: #222;
    border-bottom-left-radius: 6px;
  }

  .mic-status {
    flex: 0 0 auto;
    min-height: 24px;
    padding: 0 15px;
    font-size: 18px;
    color: #c0392b;
  }
  .input-row {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 9px;
    padding: 12px 15px;
    background: rgba(255,255,255,0.6);
  }
  .input-row textarea {
    flex: 1 1 auto;
    resize: none;
    border: 1px solid #ccc;
    border-radius: 27px;
    padding: 14px 21px;
    font-size: 24px;
    font-family: inherit;
    max-height: 135px;
    line-height: 1.3;
  }
  .input-row textarea:focus { outline: 2px solid #2f7dd6; }

  .app-header {
    flex: 0 0 auto;
    text-align: center;
    background: #111;
    color: #fff;
    padding: 9px 6px 6px;
  }
  .app-header-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .04em;
    color: #ffd700;
  }
  .app-header-subtitle {
    font-size: 17px;
    color: #d4af37;
  }
  .app-version {
    font-size: 14px;
    color: #9c7a24;
  }

  .round-btn {
    flex: 0 0 auto;
    width: 63px;
    height: 63px;
    border-radius: 50%;
    border: none;
    font-size: 27px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .send-btn { background: #2f7dd6; color: #fff; }
  .mic-btn { background: #ddd; color: #333; }
  .mic-btn.listening { background: #e0433b; color: #fff; }
  .mic-btn:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>

<div id="lockScreen">
  <div id="lockBox">
    <div>Enter password</div>
    <input type="password" id="lockInput" autocomplete="off">
    <button id="lockBtn">Unlock</button>
    <div id="lockError"></div>
  </div>
</div>

<div id="roleScreen" class="hidden">
  <div id="roleBox">
    <div class="role-title">How are you using this?</div>
    <button class="role-btn" id="roleBtnEn">Two devices - I'm English</button>
    <button class="role-btn" id="roleBtnOther">Two devices - I pick my language</button>
    <button class="role-btn" id="roleBtnSingle">One device - both languages here</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="app-header">
    <div class="app-header-title">DSR Systems</div>
    <div class="app-header-subtitle">Live Language Translator</div>
    <div class="app-version" id="appVersion"></div>
    <div class="change-role-link" id="changeRoleLink">Change device role</div>
  </div>
  <div class="top-bar">
    <button class="speak-toggle on" id="speakToggle">&#128266; Speak translations</button>
    <select class="lang-select" id="otherLangSelect"></select>
    <div class="conn-status" id="connStatus"></div>
    <div class="speak-status" id="speakStatus"></div>
  </div>
  <div class="panel panel-en" id="panel-en">
    <div class="panel-header">
      <span>English</span>
      <button class="clear-btn" onclick="clearMessages()">Clear</button>
    </div>
    <div class="messages" id="messages-en"></div>
    <div class="mic-status" id="mic-status-en"></div>
    <div class="input-row">
      <button class="round-btn mic-btn" id="mic-en">&#127908;</button>
      <textarea id="input-en" rows="1" placeholder="Type in English..."></textarea>
      <button class="round-btn send-btn" id="send-en">&#10148;</button>
    </div>
  </div>

  <div class="panel panel-hi" id="panel-hi">
    <div class="panel-header">
      <span id="panel-hi-label">Hindi</span>
      <button class="clear-btn" onclick="clearMessages()">Clear</button>
    </div>
    <div class="messages" id="messages-hi"></div>
    <div class="mic-status" id="mic-status-hi"></div>
    <div class="input-row">
      <button class="round-btn mic-btn" id="mic-hi">&#127908;</button>
      <textarea id="input-hi" rows="1" placeholder="Type in Hindi..."></textarea>
      <button class="round-btn send-btn" id="send-hi">&#10148;</button>
    </div>
  </div>
</div>

<script>
// Bump this on every deploy so it's easy to tell (bottom of the app header)
// whether a device has actually picked up the latest version, vs. showing
// a stale cached copy.
const APP_VERSION = 'Version 8';
document.getElementById('appVersion').textContent = APP_VERSION;

// --- access lock ---------------------------------------------------------
// NOTE: this is a casual deterrent only (visible in page source), not real
// security. Change ACCESS_PASSWORD below to whatever you like.
const ACCESS_PASSWORD = '2015';
const LOCK_STORAGE_KEY = 'dsrLiveChatUnlocked';

const lockScreen = document.getElementById('lockScreen');
const lockInput = document.getElementById('lockInput');
const lockBtn = document.getElementById('lockBtn');
const lockError = document.getElementById('lockError');

function tryUnlock() {
  if (lockInput.value === ACCESS_PASSWORD) {
    localStorage.setItem(LOCK_STORAGE_KEY, '1');
    lockScreen.classList.add('hidden');
    afterUnlock();
  } else {
    lockError.textContent = 'Incorrect password';
  }
}
lockBtn.addEventListener('click', tryUnlock);
lockInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

// --- keep the screen awake while the app is in use -----------------------
// Without this, Android/iOS will lock the screen mid-conversation, which
// defeats a hands-free live-transcription app. Not supported everywhere
// (notably older Safari), so this is a best-effort enhancement - fails
// silently where it's unavailable.
let wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (err) {
    // e.g. battery saver mode, or tab not visible yet - harmless, we
    // retry below whenever the tab becomes visible again.
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && role) requestWakeLock();
});

// --- device role (which side of the two-device conversation this is) ----
const ROLE_STORAGE_KEY = 'dsrLiveChatRole';
const roleScreen = document.getElementById('roleScreen');
const appEl = document.getElementById('app');
let role = localStorage.getItem(ROLE_STORAGE_KEY) || null;

function afterUnlock() {
  if (role) {
    appEl.classList.remove('hidden');
    setupForRole();
    if (role !== 'single') connectWS();
    requestWakeLock();
  } else {
    roleScreen.classList.remove('hidden');
  }
}

function applyRole(r) {
  role = r;
  localStorage.setItem(ROLE_STORAGE_KEY, r);
  roleScreen.classList.add('hidden');
  appEl.classList.remove('hidden');
  setupForRole();
  if (role !== 'single') connectWS();
  requestWakeLock();
}
document.getElementById('roleBtnEn').addEventListener('click', () => applyRole('en'));
document.getElementById('roleBtnOther').addEventListener('click', () => applyRole('other'));
document.getElementById('roleBtnSingle').addEventListener('click', () => applyRole('single'));
document.getElementById('changeRoleLink').addEventListener('click', () => {
  if (confirm('Switch this device to the other role? You will need to pick again.')) {
    localStorage.removeItem(ROLE_STORAGE_KEY);
    location.reload();
  }
});

if (localStorage.getItem(LOCK_STORAGE_KEY) !== '1') {
  lockInput.focus();
}
// NOTE: the already-unlocked case calls afterUnlock() at the bottom of this
// script, once everything it depends on (LANGUAGES, otherLangSelect, etc.)
// has actually been declared - see the end of the file.

// --- transliteration proxy -----------------------------------------------
// Fill this in once the Cloudflare Worker is deployed, e.g.
// 'https://dsrlivechat-translit.yoursubdomain.workers.dev'
// Until then, typed Hindi just skips the transliteration boost (same
// graceful fallback as any Latin-script language) - voice input is
// unaffected either way.
const TRANSLIT_WORKER_URL = 'https://dsrlivechat-translit.100dsr100.workers.dev';

// --- two-device relay -----------------------------------------------------
// Same Worker as the transliteration proxy above, relaying chat messages
// between the two paired devices over a WebSocket (Durable Object).
const CHAT_WS_URL = TRANSLIT_WORKER_URL.replace(/^http/, 'ws') + '/ws';

// Same Worker again - runs Whisper via Workers AI to transcribe recorded
// audio chunks (see setupMic below).
const TRANSCRIBE_URL = TRANSLIT_WORKER_URL + '/transcribe';

const connStatusEl = document.getElementById('connStatus');
function setConnStatus(text) { connStatusEl.textContent = text; }

let ws = null;
let reconnectDelay = 1000;
let reconnectTimer = null;

function connectWS() {
  if (!role) return;
  clearTimeout(reconnectTimer);
  setConnStatus('Connecting...');
  ws = new WebSocket(CHAT_WS_URL);
  ws.onopen = () => {
    reconnectDelay = 1000;
    setConnStatus('Connected');
    if (role === 'other') sendConfig();
  };
  ws.onmessage = (ev) => handleIncoming(ev.data);
  ws.onclose = () => {
    setConnStatus('Disconnected - reconnecting...');
    reconnectTimer = setTimeout(connectWS, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 15000);
  };
  ws.onerror = () => { try { ws.close(); } catch (err) { /* already closing */ } };
}

function sendConfig() {
  if (role === 'other' && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'config', otherLang }));
  }
}

function sendChatOverWs(text, otherText) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'chat', sender: role, text, otherText }));
}

function mySpeechLangCode() {
  return role === 'en' ? 'en' : otherLang;
}

function handleIncoming(raw) {
  let data;
  try { data = JSON.parse(raw); } catch (err) { return; }
  if (data.type === 'config') {
    if (role === 'en') {
      otherLang = data.otherLang;
      updateOtherLangUI();
      otherLangSelect.value = otherLang;
    }
    return;
  }
  if (data.type === 'chat') {
    if (data.sender === role) return;
    messages.push({ sender: data.sender, text: data.text, otherText: data.otherText });
    render();
    speakText(mySpeechLangCode(), data.otherText);
  }
}

// --- app -------------------------------------------------------------
const messages = [];

const LANGUAGES = {
  en: { name: 'English', speechLang: 'en-US', hasNonLatinScript: false },
  hi: { name: 'Hindi', speechLang: 'hi-IN', hasNonLatinScript: true, itc: 'hi-t-i0-und' },
  it: { name: 'Italian', speechLang: 'it-IT', hasNonLatinScript: false },
  es: { name: 'Spanish', speechLang: 'es-ES', hasNonLatinScript: false },
  fr: { name: 'French', speechLang: 'fr-FR', hasNonLatinScript: false },
  de: { name: 'German', speechLang: 'de-DE', hasNonLatinScript: false },
  pt: { name: 'Portuguese', speechLang: 'pt-PT', hasNonLatinScript: false },
};

let otherLang = 'hi';

async function translateText(sourceLang, targetLang, text, wantRomanization) {
  const dtParams = wantRomanization ? '&dt=t&dt=rm' : '&dt=t';
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' +
    sourceLang + '&tl=' + targetLang + dtParams + '&q=' + encodeURIComponent(text);
  const res = await fetch(url);
  const data = await res.json();
  let scriptText = '';
  let romanized = '';
  for (const seg of data[0]) {
    if (typeof seg[0] === 'string') {
      scriptText += seg[0];
    } else if (seg.length >= 3 && typeof seg[2] === 'string') {
      romanized = seg[2];
    }
  }
  return { scriptText, romanized };
}

async function transliterateToNativeScript(romanizedText, itc) {
  if (!TRANSLIT_WORKER_URL) return null;
  const res = await fetch(TRANSLIT_WORKER_URL + '?text=' + encodeURIComponent(romanizedText) + '&itc=' + encodeURIComponent(itc));
  const data = await res.json();
  if (!Array.isArray(data) || data[0] !== 'SUCCESS') return null;
  return data[1].map((seg) => seg[1][0]).join(' ').trim();
}

let speakEnabled = true;
const speakToggleBtn = document.getElementById('speakToggle');
speakToggleBtn.addEventListener('click', () => {
  speakEnabled = !speakEnabled;
  speakToggleBtn.classList.toggle('on', speakEnabled);
  speakToggleBtn.innerHTML = speakEnabled ? '&#128266; Speak translations' : '&#128263; Speak translations';
});

const speakStatusEl = document.getElementById('speakStatus');

function speakText(langCode, text) {
  if (!speakEnabled || !text) return;
  speakStatusEl.textContent = '';
  const url = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' +
    langCode + '&q=' + encodeURIComponent(text);
  const audio = new Audio();
  audio.referrerPolicy = 'no-referrer';
  audio.src = url;
  let fallbackTried = false;

  const runFallback = (reason) => {
    if (fallbackTried) return;
    fallbackTried = true;
    console.warn('Google TTS playback failed (' + reason + '), falling back to local voice');
    try {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = langCode === 'en' ? 'en-US' : (LANGUAGES[langCode]?.speechLang || langCode);
      utter.onerror = (e) => {
        speakStatusEl.textContent = 'Speech failed (' + reason + ' + local voice: ' + e.error + ')';
      };
      speechSynthesis.speak(utter);
      speakStatusEl.textContent = 'Google voice unavailable (' + reason + ') - using local voice instead';
    } catch (err2) {
      speakStatusEl.textContent = 'Speech failed: ' + reason + ' / ' + err2.message;
      console.error('speech fallback failed', err2);
    }
  };

  audio.addEventListener('error', () => runFallback('audio load error'));
  audio.play().catch((err) => runFallback(err.name + ': ' + err.message));
}

function scrollToBottom(el) {
  el.scrollTop = el.scrollHeight;
}

function renderPanel(lang) {
  const container = document.getElementById('messages-' + lang);
  container.innerHTML = '';
  for (const m of messages) {
    const bubble = document.createElement('div');
    const isOwn = m.sender === lang;
    bubble.className = 'bubble ' + (isOwn ? 'own' : 'other');
    bubble.textContent = isOwn ? m.text : m.otherText;
    container.appendChild(bubble);
  }
  scrollToBottom(container);
}

function render() {
  if (role === 'single') {
    renderPanel('en');
    renderPanel('hi');
  } else {
    renderPanel(panelKey);
  }
}

function clearMessages() {
  messages.length = 0;
  render();
}

// Live transcription can fire several finalized phrases in quick succession
// (especially across both panels at once), and each one kicks off its own
// network call to translate - those calls can resolve out of order. Routing
// every send through one shared queue guarantees messages appear in the
// order they were actually spoken/typed, not the order their translation
// happened to come back.
let sendQueue = Promise.resolve();
function enqueueSend(fn) {
  sendQueue = sendQueue.then(fn, fn);
  return sendQueue;
}

// sender is 'en' or 'hi' - which panel this message came from. rawText is
// what gets shown on the sender's own bubble; sourceOverride, when given, is
// already-native-script text (from speech recognition) that should be
// translated directly, skipping the romanized-typing transliteration boost
// below.
async function composeAndSend(sender, rawText, sourceOverride) {
  rawText = rawText.trim();
  if (!rawText) return;
  let sourceText = (sourceOverride && sourceOverride.trim()) ? sourceOverride.trim() : rawText;

  let otherText = '';
  try {
    if (sender === 'en') {
      const wantRoman = LANGUAGES[otherLang].hasNonLatinScript;
      const { romanized, scriptText } = await translateText('en', otherLang, sourceText, wantRoman);
      otherText = (wantRoman && romanized) ? romanized : scriptText;
    } else {
      const info = LANGUAGES[otherLang];
      if (info.hasNonLatinScript && !sourceOverride) {
        try {
          const converted = await transliterateToNativeScript(sourceText, info.itc);
          if (converted) sourceText = converted;
        } catch (err) {
          console.error('transliteration failed, falling back to romanized text', err);
        }
      }
      const { scriptText } = await translateText(otherLang, 'en', sourceText, false);
      otherText = scriptText;
    }
  } catch (err) {
    otherText = '[translation error]';
    console.error(err);
  }

  messages.push({ sender, text: rawText, otherText });

  if (role === 'single') {
    // Both languages live on this one device - render both panels and speak
    // the translation out loud right away, same as the original app.
    render();
    const targetLang = sender === 'en' ? otherLang : 'en';
    speakText(targetLang, otherText);
  } else {
    // Paired mode - only this device's own panel is shown; the peer device
    // speaks the translation when it receives it over the WebSocket.
    render();
    sendChatOverWs(rawText, otherText);
  }
}

function setupTextInput(lang) {
  const input = document.getElementById('input-' + lang);
  const sendBtn = document.getElementById('send-' + lang);

  const doSend = () => {
    const val = input.value;
    input.value = '';
    input.style.height = 'auto';
    enqueueSend(() => composeAndSend(lang, val));
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      doSend();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 90) + 'px';
  });
  sendBtn.addEventListener('click', doSend);
}

// Live, hands-free transcription: tap once to start. This does NOT use the
// browser's built-in SpeechRecognition (voice-input) service at all -
// Android plays an audible tone every time that service starts/stops, and
// its platform-level silence timeout kept forcing pointless restarts (and
// tones) every few seconds even during silence, with no way to suppress
// either from JS. Instead this records raw microphone audio itself,
// watches the volume to notice when you've paused, and uploads just that
// chunk to a Whisper speech-to-text model (via the Worker) - no dedicated
// OS voice-input UI is ever invoked, so no tones, and pauses are detected
// entirely on our own terms.
// Tap the button again to stop. (Starting still needs a tap - browsers
// require a user gesture before granting microphone access.)
const PAUSE_MS = 900;          // silence gap that counts as "you paused"
const MIN_SEGMENT_MS = 300;    // ignore accidental near-instant taps
const SILENCE_RMS = 10;        // volume threshold, 0-255 time-domain scale
const VAD_INTERVAL_MS = 100;

function setupMic(lang) {
  const btn = document.getElementById('mic-' + lang);
  const status = document.getElementById('mic-status-' + lang);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    btn.disabled = true;
    btn.title = 'Microphone recording not supported in this browser';
    status.textContent = 'Microphone recording not supported in this browser';
    return;
  }

  const mimeType = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4']
    .find((t) => window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';

  let listening = false;
  let stream = null;
  let audioCtx = null;
  let analyser = null;
  let dataArray = null;
  let vadTimer = null;
  let recorder = null;
  let chunks = [];
  let hasSpeech = false;
  let silenceStart = null;
  let segmentStartedAt = 0;

  async function handleTranscript(transcript) {
    if (!transcript) return;
    if (lang === 'hi') {
      const info = LANGUAGES[otherLang];
      if (info.hasNonLatinScript) {
        // Whisper already returns native-script text directly for
        // non-Latin languages - get a romanized version to display (same
        // "English characters" preference as the typed-input path), but
        // translate from the native-script transcript itself.
        try {
          const { romanized, scriptText } = await translateText(otherLang, otherLang, transcript, true);
          const displayText = romanized || scriptText || transcript;
          composeAndSend(lang, displayText, transcript);
        } catch (err) {
          composeAndSend(lang, transcript, transcript);
        }
      } else {
        composeAndSend(lang, transcript, transcript);
      }
    } else {
      composeAndSend(lang, transcript);
    }
  }

  function updateButton() {
    btn.classList.toggle('listening', listening);
    btn.textContent = listening ? '⏹' : '\u{1F3A4}';
    btn.title = listening ? 'Stop listening' : 'Start listening';
  }

  function computeRms() {
    analyser.getByteTimeDomainData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
      const v = dataArray[i] - 128;
      sum += v * v;
    }
    return Math.sqrt(sum / dataArray.length);
  }

  function startSegmentRecorder() {
    chunks = [];
    hasSpeech = false;
    silenceStart = null;
    segmentStartedAt = Date.now();
    recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    recorder.addEventListener('dataavailable', (e) => {
      if (e.data && e.data.size > 0) chunks.push(e.data);
    });
    recorder.start();
  }

  async function transcribeAndSend(blob) {
    status.textContent = 'Transcribing...';
    try {
      const langHint = lang === 'hi' ? otherLang : 'en';
      const res = await fetch(TRANSCRIBE_URL + '?lang=' + encodeURIComponent(langHint), {
        method: 'POST',
        headers: { 'Content-Type': blob.type || 'application/octet-stream' },
        body: blob,
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      const transcript = (data.text || '').trim();
      status.textContent = listening ? 'Listening...' : '';
      if (transcript) await handleTranscript(transcript);
    } catch (err) {
      console.error('transcription failed', err);
      status.textContent = 'Transcription error: ' + err.message;
    }
  }

  // Stop the current segment's recorder, immediately start a fresh one
  // (so nothing said right after is missed while we upload), then hand
  // the just-finished audio off for transcription.
  async function commitSegment() {
    if (!recorder || recorder.state === 'inactive') return;
    const finishedRecorder = recorder;
    await new Promise((resolve) => {
      finishedRecorder.addEventListener('stop', resolve, { once: true });
      finishedRecorder.stop();
    });

    const finishedChunks = chunks;
    const gotSpeech = hasSpeech;
    const durationMs = Date.now() - segmentStartedAt;

    if (listening) startSegmentRecorder();

    if (!gotSpeech || durationMs < MIN_SEGMENT_MS || finishedChunks.length === 0) return;
    const blob = new Blob(finishedChunks, { type: mimeType || 'audio/webm' });
    enqueueSend(() => transcribeAndSend(blob));
  }

  function vadTick() {
    if (!listening || !analyser) return;
    const rms = computeRms();
    if (rms > SILENCE_RMS) {
      hasSpeech = true;
      silenceStart = null;
      status.textContent = 'Listening...';
    } else if (hasSpeech) {
      if (silenceStart === null) {
        silenceStart = Date.now();
      } else if (Date.now() - silenceStart >= PAUSE_MS) {
        silenceStart = null;
        commitSegment();
      }
    }
  }

  btn.addEventListener('click', async () => {
    if (!listening) {
      status.textContent = 'Starting... (allow microphone access if asked)';
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        status.textContent = 'Microphone permission denied';
        return;
      }
      listening = true;
      updateButton();
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      dataArray = new Uint8Array(analyser.fftSize);
      source.connect(analyser);
      startSegmentRecorder();
      vadTimer = setInterval(vadTick, VAD_INTERVAL_MS);
      status.textContent = 'Listening...';
    } else {
      listening = false;
      updateButton();
      clearInterval(vadTimer);
      await commitSegment(); // flush whatever's left, don't start another
      if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
      if (audioCtx) { try { audioCtx.close(); } catch (err) { /* already closed */ } audioCtx = null; }
      analyser = null;
      status.textContent = '';
    }
  });

  updateButton();
}

function updateOtherLangUI() {
  const info = LANGUAGES[otherLang];
  document.getElementById('panel-hi-label').textContent = info.name;
  document.getElementById('input-hi').placeholder = 'Type in ' + info.name + '...';
}

const otherLangSelect = document.getElementById('otherLangSelect');
for (const code in LANGUAGES) {
  const opt = document.createElement('option');
  opt.value = code;
  opt.textContent = LANGUAGES[code].name;
  otherLangSelect.appendChild(opt);
}
otherLangSelect.value = otherLang;
otherLangSelect.addEventListener('change', () => {
  otherLang = otherLangSelect.value;
  updateOtherLangUI();
  // No mic restart needed here - the "other" panel's mic reads otherLang
  // fresh on every upload (see transcribeAndSend), not at listen-start time.
  clearMessages();
  sendConfig();
});

// --- mode-based setup --------------------------------------------------
// role is 'single' (both languages on this one device, no relay - the
// original app), or 'en' / 'other' (paired two-device mode, this device
// shows only its own panel and syncs over the WebSocket relay).
let panelKey = 'en';
let roleSetupDone = false;
function setupForRole() {
  if (roleSetupDone) return;
  roleSetupDone = true;

  if (role === 'single') {
    document.getElementById('panel-en').style.display = 'flex';
    document.getElementById('panel-hi').style.display = 'flex';
    otherLangSelect.disabled = false;
    otherLangSelect.title = '';
    updateOtherLangUI();
    setupTextInput('en');
    setupTextInput('hi');
    setupMic('en');
    setupMic('hi');
    render();
    return;
  }

  panelKey = role === 'en' ? 'en' : 'hi';
  document.getElementById('panel-en').style.display = role === 'en' ? 'flex' : 'none';
  document.getElementById('panel-hi').style.display = role === 'other' ? 'flex' : 'none';
  if (role === 'en') {
    // The English side is fixed - the other-language person picks their own
    // language and it syncs over to here.
    otherLangSelect.disabled = true;
    otherLangSelect.title = 'Set by the other side';
  } else {
    otherLangSelect.disabled = false;
    otherLangSelect.title = '';
  }
  updateOtherLangUI();
  setupTextInput(panelKey);
  setupMic(panelKey);
  render();
}

if (localStorage.getItem(LOCK_STORAGE_KEY) === '1') {
  lockScreen.classList.add('hidden');
  afterUnlock();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch((err) => {
    console.error('Service worker registration failed', err);
  });
}
</script>
</body>
</html>
